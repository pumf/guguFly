<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Effect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:transparent;user-select:none;-webkit-user-select:none;pointer-events:none}
canvas{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none}
#close-btn{position:fixed;top:20px;left:20px;width:36px;height:36px;border-radius:50%;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.3);
  color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s;z-index:10;pointer-events:auto}
#close-btn:hover{background:rgba(0,0,0,.55)}
</style></head><body>
<canvas id="c"></canvas>
<button id="close-btn">✕</button>
<script src="effect.js"></script>
</body></html>
