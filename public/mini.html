<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:transparent;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center;font-family:"PingFang SC","Hiragino Sans GB","Avenir Next",sans-serif;cursor:grab}
body.dragging{cursor:grabbing}
#m{display:flex;align-items:center;gap:12px;padding:10px 22px;border-radius:999px;
background:linear-gradient(135deg,#667eea,#764ba2);
color:#fff;font-size:14px;white-space:nowrap;box-shadow:0 8px 32px rgba(102,126,234,0.4)}
#i{font-size:18px}#t{font-weight:700;font-size:14px}#d{opacity:.8;font-size:13px;margin-left:2px}
</style></head><body>
<div id="m"><span id="i">📋</span><span id="t">加载中</span><span id="d"></span></div>
<script src="mini.js"></script>
</body></html>
