<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Video</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:transparent;user-select:none;-webkit-user-select:none;pointer-events:none}
canvas{display:block;position:fixed;top:-1px;left:-1px;width:calc(100vw + 2px);height:calc(100vh + 2px);pointer-events:none;border:none;outline:none}
#overlay{position:fixed;bottom:0;left:0;right:0;padding:40px 48px;
  background:linear-gradient(transparent,rgba(0,0,0,.7));
  pointer-events:none}
#clock{position:fixed;top:32px;left:50%;transform:translateX(-50%);font-family:"Avenir Next",sans-serif;
  font-size:80px;font-weight:800;color:#fff;letter-spacing:6px;text-shadow:0 2px 32px rgba(0,0,0,.7)}
#label{font-size:22px;font-weight:600;color:#fff;margin-bottom:8px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
#countdown{font-size:36px;font-weight:300;color:rgba(255,255,255,.85);text-shadow:0 2px 12px rgba(0,0,0,.5)}
#countdown strong{font-weight:600;color:#fff}
/* No close button — the window uses setIgnoreCursorEvents(true) for
   true click-through. Close via auto-close timer or Escape key. */
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  color:rgba(255,255,255,.8);font-size:22px;font-weight:600;
  text-shadow:0 2px 16px rgba(0,0,0,.6);text-align:center;
  transition:opacity .4s;pointer-events:none}
#loading .spinner{display:inline-block;width:32px;height:32px;margin-bottom:12px;
  border:3px solid rgba(255,255,255,.2);border-top-color:#fff;
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading.hidden{opacity:0}
#stall-hint{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.6);font-size:14px;font-weight:500;
  text-shadow:0 2px 12px rgba(0,0,0,.5);transition:opacity .5s;
  pointer-events:none;white-space:nowrap}
#stall-hint.hidden{opacity:0}
</style></head><body>
<canvas id="c"></canvas>
<div id="loading"><div class="spinner"></div><div>正在加载视频…</div></div>
<div id="stall-hint" class="hidden">⏳ 视频缓冲中，请稍候…</div>
<div id="overlay">
  <div id="label">🐱 休息一下</div>
  <div id="countdown">还剩 <strong id="remaining">0</strong> 秒</div>
</div>
<div id="clock"></div>
<script src="video.js"></script>
</body></html>
