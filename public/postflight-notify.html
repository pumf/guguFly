<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:transparent;user-select:none;-webkit-user-select:none;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:"PingFang SC","Hiragino Sans GB","Avenir Next",sans-serif}
#n{display:flex;align-items:center;gap:8px;padding:12px 24px;border-radius:16px;
background:linear-gradient(135deg,rgba(255,107,107,0.94),rgba(255,117,157,0.92));
color:#fff;font-size:14px;white-space:nowrap;box-shadow:0 8px 40px rgba(255,107,107,0.35);cursor:pointer}
#i{font-size:16px;font-weight:700}
#a{opacity:.85;font-size:13px}
</style></head><body>
<div id="n"><span>✈</span><b id="x">飞行后操作</b><span id="a">· 点此取消</span></div>
<script>
(async function(){
  function setLabel(text) {
    try { document.getElementById('x').textContent = String(text || '飞行后操作'); } catch(e) {}
  }
  function notifyClicked() {
    try {
      if (window.__TAURI__ && window.__TAURI__.event && window.__TAURI__.event.emit) {
        window.__TAURI__.event.emit('pf-notify-clicked');
      } else if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
        window.__TAURI__.core.invoke('pf_notify_clicked');
      } else {
        try { window.close(); } catch(e) {}
      }
    } catch(err) {
      try { window.close(); } catch(e) {}
    }
  }
  try {
    var n = document.getElementById('n');
    n.addEventListener('click', function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      notifyClicked();
    });
  } catch(e) {
    try { var n2 = document.getElementById('n'); n2.onclick = function(){ notifyClicked(); }; } catch(_){}
  }
  try {
    if (window.__TAURI__ && window.__TAURI__.event && window.__TAURI__.event.listen) {
      await window.__TAURI__.event.listen('pf-notify-set-label', function(event){
        setLabel(event && event.payload && event.payload.label);
      });
    }
  } catch(e) {}
})();
</script>
</body></html>
