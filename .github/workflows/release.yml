name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.5.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri ARM64
        run: npm run tauri build -- --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Prepare ARM64 updater files
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          mv *.app.tar.gz gugufly-aarch64.app.tar.gz
          mv *.app.tar.gz.sig gugufly-aarch64.app.tar.gz.sig

      - name: Build Tauri x86_64
        run: npm run tauri build -- --target x86_64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Prepare Intel updater files
        run: |
          cd src-tauri/target/x86_64-apple-darwin/release/bundle/macos
          mv *.app.tar.gz gugufly-x86_64.app.tar.gz
          mv *.app.tar.gz.sig gugufly-x86_64.app.tar.gz.sig

      - name: Rename and Upload ARM64
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/gugufly-aarch64.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/gugufly-aarch64.app.tar.gz.sig
          tag_name: v${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename and Upload Intel
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/gugufly-x86_64.app.tar.gz
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/gugufly-x86_64.app.tar.gz.sig
          tag_name: v${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Prepare Linux updater files
        run: |
          cd src-tauri/target/release/bundle/appimage
          mv *.AppImage.tar.gz gugufly-x86_64.AppImage.tar.gz 2>/dev/null || true
          mv *.AppImage.tar.gz.sig gugufly-x86_64.AppImage.tar.gz.sig 2>/dev/null || true

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/gugufly-x86_64.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/gugufly-x86_64.AppImage.tar.gz.sig
          tag_name: v${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Prepare Windows updater files
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/nsis
          mv *.nsis.zip gugufly-x86_64.nsis.zip 2>/dev/null || true
          mv *.nsis.zip.sig gugufly-x86_64.nsis.zip.sig 2>/dev/null || true

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/gugufly-x86_64.nsis.zip
            src-tauri/target/release/bundle/nsis/gugufly-x86_64.nsis.zip.sig
          tag_name: v${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  generate-manifest:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets and generate manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -e

          # Download all updater signatures from the release. The updater
          # manifest must contain a valid signature for every platform entry.
          gh release download "v${VERSION}" \
            --dir /tmp/sigs \
            --pattern "*.sig" \
            --repo pumf/guguFly

          read_sig() {
            file="/tmp/sigs/$1"
            if [ ! -s "$file" ]; then
              echo "::error::Missing updater signature: $1"
              exit 1
            fi
            cat "$file"
          }

          ARM64_SIG="$(read_sig gugufly-aarch64.app.tar.gz.sig)"
          X86_SIG="$(read_sig gugufly-x86_64.app.tar.gz.sig)"
          LINUX_SIG="$(read_sig gugufly-x86_64.AppImage.tar.gz.sig)"
          WIN_SIG="$(read_sig gugufly-x86_64.nsis.zip.sig)"

          # Get actual release body for notes
          NOTES=$(gh release view "v${VERSION}" --json body --jq '.body' --repo pumf/guguFly || echo "Release v${VERSION}")

          # Determine asset filenames (URL-encode Chinese characters)
          ARM64_URL="https://github.com/pumf/guguFly/releases/download/v${VERSION}/gugufly-aarch64.app.tar.gz"
          X86_URL="https://github.com/pumf/guguFly/releases/download/v${VERSION}/gugufly-x86_64.app.tar.gz"
          LINUX_URL="https://github.com/pumf/guguFly/releases/download/v${VERSION}/gugufly-x86_64.AppImage.tar.gz"
          WIN_URL="https://github.com/pumf/guguFly/releases/download/v${VERSION}/gugufly-x86_64.nsis.zip"

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg arm64_sig "$ARM64_SIG" \
            --arg arm64_url "$ARM64_URL" \
            --arg x86_sig "$X86_SIG" \
            --arg x86_url "$X86_URL" \
            --arg linux_sig "$LINUX_SIG" \
            --arg linux_url "$LINUX_URL" \
            --arg win_sig "$WIN_SIG" \
            --arg win_url "$WIN_URL" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $arm64_sig, url: $arm64_url },
                "darwin-x86_64": { signature: $x86_sig, url: $x86_url },
                "linux-x86_64": { signature: $linux_sig, url: $linux_url },
                "windows-x86_64": { signature: $win_sig, url: $win_url }
              }
            }' > latest.json

          cat latest.json

      - name: Upload manifest
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
          tag_name: v${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
